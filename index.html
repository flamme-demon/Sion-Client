<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/branding/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <title>Sion Client</title>
    <style>
      #sion-demarrage { position: fixed; inset: 0; z-index: 2147483646; background: #050907; opacity: 1; transition: opacity 180ms ease; }
      #sion-demarrage picture, #sion-demarrage img, #sion-demarrage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
      #sion-demarrage video { opacity: 0; }
      #sion-demarrage[data-video-prete] video { opacity: 1; }
      #sion-demarrage[data-termine] { opacity: 0; }
      @media (prefers-reduced-motion: reduce) { #sion-demarrage { transition: none; } }
    </style>
  </head>
  <body>
    <div id="sion-demarrage" role="status" aria-label="Sion">
      <picture>
        <source media="(max-width: 767px)" srcset="/branding/demarrage-mobile.webp" />
        <img src="/branding/demarrage-desktop.webp" alt="" fetchpriority="high" />
      </picture>
      <video muted playsinline preload="none" aria-hidden="true"></video>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
