[workspace]
members = ["native-audio", "sion-matrix", "camera-effects"]
default-members = ["."]
resolver = "2"

[package]
name = "sion-client"
version = "2.0.1"
description = "Sion Client - Voice/Text client based on Matrix + LiveKit"
authors = ["Sion"]
license = "MIT OR Apache-2.0"
repository = ""
edition = "2021"
rust-version = "1.96"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Android + voix : garder les fonctions JNI de libwebrtc (voir build.rs).
# Même version que celle du build script de webrtc-sys (déjà compilée).
webrtc-sys-build = "0.3.19"

[dependencies]
serde_json = "1.0"
semver = "1"
sha2 = "0.11"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# Raw bytes ↔ f32 slice reinterpretation for the denoise IPC path — keeps
# audio frames out of JSON serde (which plateaued the pipeline below real-time).
# `extern_crate_alloc` exposes `pod_collect_to_vec` for the aligned bulk copy
# from the 1-byte-aligned `Vec<u8>` delivered by Tauri into a `Vec<f32>`.

tauri = { version = "2", features = ["devtools"] }
tauri-plugin-log = "2"
open = "5"
# `blocking` : le lecteur télécharge le média avant de le passer à ffmpeg,
# depuis une commande synchrone (voir `ramener_en_local`).
reqwest = { version = "0.13", features = ["rustls-no-provider", "cookies", "json", "blocking"], default-features = false }
urlencoding = "2"
scraper = "0.27"
base64 = "0.23"
dirs = "7"
# Détection de la langue système (navigator.language est peu fiable sous WRY).
sys-locale = "0.3"
tauri-plugin-notification = "2.3.3"

# Voix native — moteur LiveKit unique depuis le retrait de LiveKit JS.
# Feature optionnelle le temps de WRY pour ne pas alourdir les builds par
# défaut (libwebrtc est volumineux). TLS en rustls/webpki-roots comme
# reqwest ci-dessus (pas d'OpenSSL système requis).
sion-native-audio = { path = "native-audio", optional = true }
sion-camera-effects = { path = "camera-effects", optional = true }
webrtc-sys = { version = "=0.3.49", features = ["sion-audio"], optional = true }
# `glib-main-loop` : indispensable au capturer PipeWire/Wayland — sans la
# boucle GLib, le portail XDG affiche le sélecteur d'écran mais aucune frame
# n'est jamais délivrée (erreurs temporaires en boucle au partage).
livekit = { version = "0.9.5", default-features = false, features = ["tokio", "rustls-tls-webpki-roots", "glib-main-loop"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"], optional = true }
futures-util = { version = "0.3", optional = true }
# JPEG seul (rendu partage d'écran natif) : pas de décodeurs/format lourds.

# Encodeur JPEG SIMD pur Rust (~5× l'encodeur scalaire de `image` sur x86,
# 4:4:4 pour du texte net) : le pont JPEG du partage d'écran y passe.
jpeg-rusturbo = { version = "0.9", optional = true }
# WebSocket local du partage reçu (`native_video_transport`) et des raccourcis.
tungstenite = "0.30"
# QR codes dessinés en SVG (connexion d'un téléphone, vérification) : même
# version que celle de matrix-sdk (fonction `qrcode`).
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# Cœur Matrix en Rust (docs/plan-matrix-rust-sdk.md), feature
# `moteur-matrix-rust` : ordinateur ET Android (docs/plan-android-2.1.md).
sion-matrix = { path = "sion-matrix", optional = true }
# Moteur Matrix Rust : matrix-sdk active rustls avec aws-lc-rs, l'appli et
# LiveKit avec ring — deux fournisseurs, rustls ne choisit plus seul et la
# connexion de LiveKit paniquait. `run()` installe ring par défaut.
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"], optional = true }

# Desktop-only dependencies (all platforms except Android)
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-updater = { version = "2.12", default-features = false, features = ["rustls-tls"] }
tauri-plugin-global-shortcut = "2"
# Store the active Matrix session in the OS credential vault during the
# transition to 2.1 (Secret Service, Keychain, or Windows Credential Manager).
#
# MIGRATION PROGRESSIVE, en deux temps — ne pas sauter l'étape :
#   1. aujourd'hui, aucun backend n'est enregistré auprès de keyring-core ;
#      lib.rs utilise alors un store de test en mémoire. Tant que c'est le cas, la
#      migration reste dormante : `session.json` (0600) garde le jeton, puisque
#      la sonde de `lib.rs` (`secure_session_set_verified`) refuse de retirer la
#      copie disque sans relecture réussie ;
#   2. pour activer le coffre, ajouter le store natif de chaque plateforme,
#      l'enregistrer au démarrage et fournir ses dépendances système dans la CI.
#      La migration se fait alors au premier `load_session`.
keyring = { package = "keyring-core", version = "1" }
# Lecture du presse-papiers (image collée au Ctrl+V) : WebKitGTK n'expose pas
# les images dans `clipboardData.items`, contrairement à CEF/Chromium.
arboard = { version = "3", features = ["wayland-data-control"] }
# Profils exportés (`.sionprofil`) : une archive zip. Sans les fonctions par
# défaut — bzip2 et zstd tirent des bibliothèques C —, `deflate` suffit.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# JPEG (partage d'écran natif) + PNG (image du presse-papiers).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# Persists window position/size/maximised/fullscreen state across launches
# (desktop only — mobile windows are fullscreen and managed by the OS).
tauri-plugin-window-state = "2"
# Native file picker — used by the "Parcourir" button to select an ffmpeg.exe.
# (tauri-plugin-dialog can't be used: it pulls tauri-plugin-fs on schemars 0.8
# while the tauri fork uses schemars 1.0 → build conflict.)
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
# Sortie audio locale (`cue_playback`, lecteur vidéo) : bureau seulement —
# sous Android, cpal tirerait oboe (C++) pour un cue de sourdine.
cpal = "0.18"
# Meeting transcription (local ASR). transcribe-cpp binds transcribe.cpp
# (handy-computer): one ggml inference engine for 16 ASR families — whisper
# AND parakeet-tdt-v3 GGUFs run through the same API, so the user-facing
# choice is just "which model". Dynamic CPU backends are bundled for SIMD
# portability; Vulkan/CUDA can be enabled later. Silero 6.2 gates the audio
# reaching ASR; earshot 1.x provides a pure-Rust neural VAD fallback (16 ms
# frames, Rust >= 1.87).
transcribe-cpp = { version = "0.4", features = ["dynamic-backends"] }
earshot = "1.2"

# Native cursor-overlay window: painted outside the webview because a
# transparent click-through webview is fragile across runtimes.
# - `winit` creates the window (ARGB, always-on-top, no decorations, no
#   hittest), `with_any_thread(true)` lets us spawn the event loop off the
#   main thread so it coexists with Tauri's own runtime.
# - `tiny-skia` does the 2D rasterisation (cursor arrows + click ripples)
#   in pure software — no GL context, ~50-200 µs per frame for 10 cursors.
# - `softbuffer` blits the pixmap into the native window surface.
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle", "rwh_06"] }
tiny-skia = "0.12"
softbuffer = "0.4"
raw-window-handle = "0.6"
# Glyph rasteriser for the cursor name pill. Pulled in once per overlay
# session — DejaVu Sans Bold (~700 KB) is embedded via include_bytes! so
# we don't depend on the host having any specific font installed.
ab_glyph = "0.2"


# Linux-only dependencies (rdev for evdev keyboard capture)
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# Surface vidéo réellement séparée du toplevel WebKit sous Wayland. On réutilise
# la connexion libwayland détenue par GDK (un objet parent wl_surface ne peut
# pas être référencé depuis une seconde connexion).
gdkwayland-sys = "0.18"
wayland-client = { version = "0.31", features = ["system"] }
wayland-sys = { version = "0.31", features = ["client"] }
# `wl_egl_window` : la sous-surface vidéo est présentée par le GPU, pas par un
# memcpy `wl_shm`. Le compositeur reçoit une texture déjà en mémoire GPU, la
# conversion YUV→RGB se fait dans le shader et la mise à l'échelle est faite
# par l'échantillonneur — plus aucune conversion libyuv ni copie de 8,3 Mo par
# image sur le chemin chaud.
# Overlay des curseurs en surface `zwlr_layer_shell_v1`. Sous KDE/Wayland, KWin
# gere ses bureaux virtuels nativement et ne les expose PAS a XWayland :
# `_NET_NUMBER_OF_DESKTOPS` y vaut 1, donc `_NET_WM_STATE_STICKY` et
# `_NET_WM_DESKTOP = 0xFFFFFFFF` demandent « tous les bureaux » a une couche qui
# n'en connait qu'un. Une surface layer-shell n'est pas une fenetre de bureau :
# elle vit dans une couche du compositeur, au-dessus des fenetres et
# independamment des bureaux virtuels.
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-egl = "0.32"
# EGL chargé dynamiquement (`libEGL.so.1`) : aucune dépendance de lien
# supplémentaire pour les machines qui n'ont pas de pile EGL.
khronos-egl = { version = "6", features = ["dynamic"] }
rdev = { git = "https://github.com/rustdesk-org/rdev", rev = "0904f23ce496e255461a98848b85c11fa5a62eab" }
# Background global shortcuts via the XDG portal (org.freedesktop.portal.
# GlobalShortcuts). The X11-grab path (tauri-plugin-global-shortcut) resolves
# keys through US keysyms, so layout-dependent keys (² on AZERTY = Backquote)
# either fail to register or grab the wrong key — the portal lets the
# compositor do the capture instead, and works in front of native Wayland
# windows too. Already in-tree transitively via rfd's xdg-portal feature.
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }
# keysym → name ("XK_twosuperior") for building layout-aware portal triggers.
xkeysym = "0.2"
futures-util = { version = "0.3", default-features = false }
# Notifications système adressées directement au serveur du bureau
# (`notifications_bureau.rs`) : boutons, réponse intégrée KDE, historique.
# Déjà dans l'arbre (ashpd, notify-rust), mêmes options : rien à recompiler.
zbus = { version = "5", default-features = false, features = ["tokio"] }
# Used to mark the cursor overlay sticky (on all virtual desktops) via the
# EWMH `_NET_WM_STATE_STICKY` ClientMessage. The overlay runs on XWayland, so
# KWin/Mutter honor X11 window-state hints. Already in the lockfile (transitive
# via winit's x11 backend) — promoted to a direct dep, ~0 compile cost.
# x11rb avec SHM (blit sans copie), SHAPE (clic traversant) et RANDR
# (géométrie du moniteur principal) — hôte X11 de l'overlay curseurs.
# rustix : création du segment partagé (même crate que softbuffer, déjà dans
# l'arbre).
x11rb = { version = "0.14", features = ["shm", "shape", "randr"] }
rustix = { version = "1", features = ["shm", "mm", "fs"] }
# Lecture brute du presse-papiers Wayland (protocole wlr-data-control) : on
# récupère le PNG/JPEG tel quel, sans décodage ni ré-encodage — indispensable
# pour un Ctrl+V instantané à taille réelle. Déjà en arbre via arboard.
wl-clipboard-rs = "0.9"
# NOTE: `pipewire = "0.9"` was added here for the screen-share-audio
# exclusion path (commit 2a) but removed because libpipewire's static
# constructors (run before main()) conflict with the windowing stack's
# GLib/Wayland init order. Future re-introduction needs lazy loading
# via `libloading` (dlopen at first capture call, not at process start)
# or — simpler — switch the enumeration path to a `pw-cli ls Node` subprocess
# parse, mirroring how we already use `pactl` elsewhere.
# Réglages WebKit du web process (mémoire) : le crate est déjà en arbre via
# wry — on le promeut en dépendance directe pour régler le modèle de cache et
# désactiver le page cache depuis `lib.rs`.
# `v2_20` : signal `web-process-terminated` (repli « page blanche NVIDIA »,
# cf. `gpu_fallback.rs`) — le WebKitGTK système est très au-dessus depuis
# longtemps.
webkit2gtk = { version = "2", features = ["v2_20"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
# Vérification TLS du système pour matrix-sdk (reqwest 0.13) : initialisée au
# démarrage par `android_natif.rs`. Même version que celle de matrix-sdk ; le
# composant Kotlin assorti vient de Gradle (voir app/build.gradle.kts).
rustls-platform-verifier = "0.7"
# L'API de `rustls-platform-verifier` est en jni 0.22 (Tauri et libwebrtc
# restent en 0.21).
jni22 = { package = "jni", version = "0.22" }

# Windows-only dependencies (WASAPI process-loopback exclude for screen-share
# audio that excludes Sion's own output — Windows 11 / Server 2022 build
# 20348+ via AUDCLNT_PROCESSLOOPBACK_EXCLUDE_TARGET_PROCESS_TREE).
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    # `IVirtualDesktopManager` : ramener l'overlay des curseurs sur le bureau
    # virtuel courant. API documentee et stable, contrairement a l'epinglage.
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Variant",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    ] }
# `implement` macro from windows = 0.58+ requires windows-core to be present
# as a direct dependency (it's no longer re-exported transitively).
windows-core = "0.62"

[dev-dependencies]
tempfile = "3"

[features]
# Native WRY, voice and Matrix are the default desktop and Android features.
# Desktop-only code uses platform cfg attributes; Android keeps both engines.
default = ["native-voice", "moteur-matrix-rust"]
native-voice = ["dep:sion-native-audio", "dep:webrtc-sys", "dep:livekit", "dep:tokio", "dep:futures-util", "dep:jpeg-rusturbo", "dep:sion-camera-effects"]
# Moteur Matrix Rust : actif par défaut ; SION_MATRIX_MOTEUR=js relance
# l'ancien moteur (secours), =rust-apercu l'écran de diagnostic du cœur.
moteur-matrix-rust = ["dep:sion-matrix", "dep:rustls"]

# serde_json is on the IPC hot path; keep it optimized even in dev builds.
[profile.dev.package.serde_json]
opt-level = 3

# Pont vidéo du partage d'écran : l'encodage JPEG tourne dans le binaire dev
# (non optimisé) — sans ça, ~300 ms/frame mesurés en prod contre ~15 ms
# attendus (SIMD inutilisable sans optimisation). Même logique que serde_json.
[profile.dev.package.jpeg-rusturbo]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
# Overlay curseurs : rasterisation software plein écran (5120 px) à chaque
# redraw — en opt 0, chaque frame prend des centaines de ms et la boucle ne
# suit plus (2 im/s mesurées au lieu de 30). Même remède, trois crates.
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.tiny-skia-path]
opt-level = 3
[profile.dev.package.ab_glyph]
opt-level = 3
# Notre propre code chaud : la composition du bandeau sur les plans I420
# parcourt cent mille pixels par image, et le lecteur en veut soixante par
# seconde. À l'opt 0, cette boucle seule prend 15 ms par image et la vidéo
# passe au ralenti dans le binaire de développement — le paquet livré, lui,
# est déjà optimisé. Le coût est une compilation plus lente à chaque
# itération ; en échange le lecteur est regardable en dev.
[profile.dev.package.sion-client]
opt-level = 3

# Patches crates-io pour le build desktop
# Pour build Android: utiliser ./build-scripts/build-android.sh qui désactive
# les dépendances natives (pas de libwebrtc Android).
[patch.crates-io]
# Expose WebRTC capture post-processing and explicit software AEC/AGC control.
webrtc-sys = { path = "vendor/webrtc-sys" }
# Expose WebRTC's per-source playback gain on RtcAudioTrack.
libwebrtc = { path = "vendor/libwebrtc" }
# notify-rust 4.18 : `show()` bloque via zbus/tokio et panique dans le runtime
# tokio de Tauri (notifications muettes). Le fork isole l'appel sur un thread
# std. Voir vendor/notify-rust/SION_PATCH.md.
notify-rust = { path = "vendor/notify-rust" }
# La branche WRY n'a plus besoin du fork Tauri historique introduit pour CEF.
# On suit les crates Tauri 2 stables et on ne conserve qu'un correctif Linux
# ciblé. Voir vendor/tauri-runtime-wry/SION_PATCH.md.
tauri-runtime-wry = { path = "vendor/tauri-runtime-wry" }
# Linux : seuils de pression mémoire de WebKit à la mesure de la RAM. Avec
# ceux par défaut, le processus web purgeait ses polices toutes les 30 s
# au-delà d'1 Go, remappait les polices de repli à chaque fois, et finissait
# tué à 4 Go. Voir vendor/wry/SION_PATCH.md.
wry = { path = "vendor/wry" }

# Vendored softbuffer with the Wayland buffer format patched from `Xrgb8888`
# to `Argb8888`. Without this, the cursor-overlay window appears as an opaque
# black rectangle on KDE/GNOME Wayland because the compositor discards the
# alpha bits softbuffer writes. See vendor-softbuffer/src/backends/wayland/buffer.rs.
# MUST live under [patch.crates-io] — softbuffer comes from crates-io. (It was
# mistakenly placed under the tauri git-patch section below, so Cargo looked
# for `softbuffer` in the tauri git repo → [[patch.unused]] → black overlay.)
softbuffer = { path = "vendor-softbuffer" }

# Keep the native 10 ms audio callback optimized in development too.
[profile.dev.package.sion-native-audio]
opt-level = 3
[profile.dev.package.sion-camera-effects]
opt-level = 3
[profile.dev.package.tract-core]
opt-level = 3
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.nnnoiseless]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3
[profile.dev.package.easyfft]
opt-level = 3
