[package]
name = "sion-camera-effects"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
tiny-skia = "0.11"
tract-onnx = { version = "=0.23.8", default-features = false }
